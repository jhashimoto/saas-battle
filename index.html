<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LINE Mini App SaaS Battle</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #0D1117; color: #F0F6FC; }

      /* スライダー：スマホタッチ操作最適化 */
      input[type=range] {
        -webkit-appearance: none;
        appearance: none;
        touch-action: pan-x;
      }
      input[type=range]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 28px; height: 28px;
        border-radius: 50%;
        background: currentColor;
        cursor: pointer;
        margin-top: -12px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.5);
      }
      input[type=range]::-moz-range-thumb {
        width: 28px; height: 28px;
        border-radius: 50%;
        background: currentColor;
        cursor: pointer;
        border: none;
        box-shadow: 0 2px 6px rgba(0,0,0,0.5);
      }
      input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; }
      input[type=range]::-moz-range-track { height: 4px; border-radius: 2px; }

      /* 戦況バトル演出アニメーション */
      @keyframes countUp {
        0% { opacity:0; transform: translateY(8px) scale(0.9); }
        50% { opacity:1; transform: translateY(-2px) scale(1.05); }
        100% { opacity:1; transform: translateY(0) scale(1); }
      }
      @keyframes slideInRight {
        0% { opacity:0; transform: translateX(30px); }
        100% { opacity:1; transform: translateX(0); }
      }
      @keyframes pulseGlow {
        0%,100% { filter: brightness(1); }
        50% { filter: brightness(1.5); }
      }
      @keyframes flashRed {
        0%,100% { background-color: transparent; }
        30% { background-color: rgba(248,81,73,0.25); }
      }
      @keyframes flashGreen {
        0%,100% { background-color: transparent; }
        30% { background-color: rgba(63,185,80,0.25); }
      }
      @keyframes popIn {
        0% { opacity:0; transform: scale(0.7); }
        60% { opacity:1; transform: scale(1.1); }
        100% { opacity:1; transform: scale(1); }
      }
      .sb-countup { animation: countUp 0.5s ease-out; }
      .sb-slidein { animation: slideInRight 0.4s ease-out; }
      .sb-pulseglow { animation: pulseGlow 1.2s ease-in-out 2; }
      .sb-flash-red { animation: flashRed 0.8s ease-out; }
      .sb-flash-green { animation: flashGreen 0.8s ease-out; }
      .sb-popin { animation: popIn 0.45s cubic-bezier(0.34,1.56,0.64,1); }
      .sb-bar-fill { transition: width 1.1s cubic-bezier(0.22,1,0.36,1); }
      .sb-pie-seg { transition: all 0.8s cubic-bezier(0.22,1,0.36,1); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
